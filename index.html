<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#3a2412">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<title>Tape Sketch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{--cream:#e8dcba;--ink:#1b1b2b;--brown:#3b2616;--orange:#ff8a3d;--key:#d4c7a2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;height:100%;background:#2b1b0e;overscroll-behavior:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--brown);user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font:inherit;user-select:text;-webkit-user-select:text}
.sk{font-family:'Permanent Marker','Marker Felt','Segoe Print','Comic Sans MS',cursive}
#app{height:100dvh;max-width:480px;margin:0 auto;padding:max(6px,env(safe-area-inset-top)) 6px max(6px,env(safe-area-inset-bottom));display:flex}
#wood{flex:1;min-width:0;border-radius:16px;padding:9px;display:flex;background:#5c3a1e;box-shadow:0 2px 0 rgba(0,0,0,.4)}
#panel{flex:1;min-width:0;position:relative;border-radius:9px;background:var(--cream);border:2px solid #bfae80;overflow:hidden;display:flex;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
#panel::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 0 0,rgba(90,60,25,.28),transparent 38%),radial-gradient(circle at 100% 100%,rgba(90,60,25,.3),transparent 42%),radial-gradient(circle at 100% 0,rgba(90,60,25,.15),transparent 30%)}
#tex{position:absolute;inset:0;pointer-events:none;z-index:6;background-size:100% 100%}
.scr{display:none;flex:1;min-width:0;min-height:0;flex-direction:column;padding:11px 9px 9px;position:relative;z-index:1;overflow-y:auto;gap:9px}
.scr.on{display:flex}
.row{display:flex;align-items:center;gap:6px}
.gaf{background:repeating-linear-gradient(45deg,#3b3b37 0 2px,#31312d 2px 4px);color:#ece3c8;font-size:12px;padding:7px 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;clip-path:polygon(0 10%,3% 0,97% 5%,100% 0,98% 50%,100% 100%,3% 95%,0 90%,2% 50%);user-select:none;white-space:nowrap}
.gaf.off,.msk{background:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 1px,transparent 1px 3px),#e6d6a3;color:var(--ink)}
.msk{font-size:11px;padding:4px 9px;display:inline-block;clip-path:polygon(0 0,3% 8%,0 20%,2% 40%,0 60%,3% 80%,0 100%,100% 100%,97% 85%,100% 65%,98% 45%,100% 25%,97% 10%,100% 0);white-space:nowrap;border:0}
.key{display:flex;align-items:center;justify-content:center;gap:5px;height:38px;flex:1;background:var(--key);border:1px solid #9c8c60;border-bottom:3px solid #8c7b50;border-radius:5px;color:var(--brown);font-size:12px;user-select:none}
.key:active,.key.dn{border-bottom-width:1px;transform:translateY(2px)}
.led{width:8px;height:8px;border-radius:50%;background:#7a6a4a;border:1px solid #5a4a2a}
.key.on .led{background:var(--orange);border-color:#a04a12}
.recdot{width:16px;height:16px;border-radius:50%;background:#c0392b;border:1px solid #6a1a12}
.rec.blink .recdot{animation:bl .7s steps(2,jump-none) infinite}
.rec.live .recdot{background:#ff3b2a}
@keyframes bl{50%{opacity:.25}}
.top{margin:0 -4px}
#title{flex:1;min-width:0;max-width:210px;text-align:center;font-size:13px;padding:5px 12px;transform:rotate(1.5deg);outline:0;margin-left:auto;background-color:#e6d6a3}
.gear{width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:#5a4a2a}
.win{display:flex;align-items:center;gap:6px}
.reel{width:58px;height:58px;border-radius:50%;background:#1c1108;border:3px solid #8c7d55;box-shadow:inset 0 2px 5px #000;display:flex;align-items:center;justify-content:center;flex:none}
.sp{animation:sp 2s linear infinite;animation-play-state:paused;transform-origin:center}
.pl .sp{animation-play-state:running}
@keyframes sp{to{transform:rotate(360deg)}}
.mid{flex:1;min-width:0}
.lcd{background:#1a0f06;border:2px solid #6e5a38;border-radius:4px;padding:2px 6px;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--orange)}
.lr{display:flex;align-items:center;gap:4px;height:29px;font-size:11px}
.lr .v{min-width:30px;text-align:center;font-size:17px}
.lr .u{opacity:.8}
.lr .r{margin-left:auto;font-size:13px}
.adj{width:28px;height:24px;background:#3a2412;color:var(--orange);border:1px solid #6e5a38;border-radius:3px;font-size:17px;line-height:1;touch-action:none}
.adj:active{background:#55341b}
.tapk{height:24px;padding:0 7px;background:#3a2412;color:var(--orange);border:1px solid #6e5a38;border-radius:3px;font-size:11px;margin-left:auto}
.tw{background:#22150b;border:2px solid #6e5a38;border-radius:5px;padding:6px;display:flex;flex-direction:column;gap:6px}
.twm{display:flex;gap:6px}
.tl{width:64px;flex:none;display:flex;flex-direction:column;gap:4px}
.tlr{height:24px;display:flex;align-items:center}
.tlr .msk{font-size:11px;padding:3px 7px;cursor:pointer}
.tlr .gaf{font-size:11px;padding:5px 7px;transform:rotate(-1deg)}
.tc{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;gap:4px}
.tc canvas{display:block;width:100%;height:24px;background:#140c05;border-radius:2px;cursor:pointer}
.tc canvas.sel{outline:2px solid var(--orange)}
.tc canvas.rc{outline:2px solid #ff3b2a;animation:bl .6s steps(2,jump-none) infinite}
#ph{position:absolute;top:0;bottom:0;left:0;width:2px;background:#fff;opacity:.8;pointer-events:none;display:none}
.nudge{align-items:center;gap:7px;justify-content:center}
.nb{width:40px;height:34px}
.nv{min-width:62px;text-align:center;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;color:var(--orange)}
.nudge .gaf{font-size:11px;padding:6px 8px}
#chs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;flex:1;min-height:250px}
.strip{background:#d9cca6;border:1px solid #a8996f;border-radius:6px;padding:6px 3px;display:flex;flex-direction:column;align-items:center;gap:5px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4);min-height:0}
.strip .lab{transform:rotate(-1.5deg)}
.strip:nth-child(even) .lab{transform:rotate(1.5deg)}
.kb{text-align:center;line-height:1;display:flex;flex-direction:column;align-items:center}
.kb .l{font-size:11px;color:var(--ink);transform:rotate(-2deg);margin-top:1px}
.knob{width:46px;height:46px;touch-action:none;cursor:ns-resize}
.knob svg{display:block}
.screwpad{height:59px;display:flex;align-items:center;justify-content:center}
.fader{position:relative;flex:1;min-height:70px;width:36px;touch-action:none}
.fader .slot{position:absolute;left:50%;top:6px;bottom:6px;width:10px;margin-left:-5px;background:#140c05;border-radius:5px;box-shadow:inset 0 2px 3px #000,0 1px 0 rgba(255,255,255,.5)}
.fader .cap{position:absolute;left:50%;margin-left:-15px;width:30px;height:18px;background:linear-gradient(#41362c,#241a12);border:1px solid #0d0804;border-radius:3px;box-shadow:0 2px 3px rgba(0,0,0,.55);top:0}
.fader .cap i{position:absolute;left:3px;right:3px;top:8px;height:2px;background:#f1e7cc}
.btns{display:flex;gap:6px;min-height:24px;align-items:center}
.arm{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8a4a44,#4a1c16);border:1px solid #2a0e0a}
.arm.a{background:radial-gradient(circle at 35% 30%,#ff7a6a,#b32a1c);border-color:#6a1a12}
.arm.rc{animation:bl .6s steps(2,jump-none) infinite}
.sm{min-width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:var(--key);border:1px solid #9c8c60;border-bottom:3px solid #8c7b50;border-radius:3px;color:var(--brown);font-size:12px;padding:0 4px}
.sm.on{background:#e0702b;color:#fff;border-color:#9a4510}
.hasled{width:7px;height:7px;border-radius:50%;background:#8a7a5a;display:inline-block;margin-right:4px}
.hasled.on{background:var(--orange)}
.bot{justify-content:space-between;margin:0 -4px}
.bot .gaf{font-size:11px}
.sw8{display:flex;align-items:center;gap:6px;margin-top:-3px}
.pnote{background:repeating-linear-gradient(transparent 0 13px,rgba(70,90,140,.25) 13px 14px),#f5efd6;color:var(--ink);font-size:12px;line-height:14px;padding:6px 9px 4px;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.pnote i{position:absolute;top:-6px;width:26px;height:10px;background:rgba(230,214,163,.9)}
.preset{display:flex;align-items:center;gap:8px;justify-content:center}
.arr{width:40px;height:34px;display:flex;align-items:center;justify-content:center;background:var(--key);border:1px solid #9c8c60;border-bottom:3px solid #8c7b50;border-radius:5px;color:var(--brown)}
#pname{flex:1;max-width:200px;text-align:center;font-size:13px;padding:6px 10px;transform:rotate(-1deg)}
#mini{width:160px;height:40px;background:#22150b;border:2px solid #6e5a38;border-radius:4px;display:block;margin:0 auto}
.gw{display:flex;gap:6px;min-height:0}
.labs,.in{display:flex;flex-direction:column;gap:5px}
.labs{width:62px;flex:none}
.labs .sp0{height:16px}
.lb{height:34px;display:flex;align-items:center}
.lb .msk{cursor:pointer;transition:background-color .1s}
.lb .msk.hit{background-color:#ffb066}
#sc{flex:1;min-width:0;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
#sc::-webkit-scrollbar{display:none}
.in{width:max-content}
.hdr,.rw{display:flex}
.hdr{height:16px}
.hd{flex:none;width:var(--sw);margin-right:3px;text-align:center;font-size:11px;color:var(--ink);line-height:16px}
.st{flex:none;width:var(--sw);height:34px;margin-right:3px;border-radius:4px;background:var(--key);border:1px solid #9c8c60;border-bottom:3px solid #8c7b50;box-sizing:border-box}
.st.g,.hd.g{margin-left:5px}
.st.sn,.hd.sn{scroll-snap-align:start}
.st.on{background:var(--orange);border-color:#a04a12;border-bottom-width:1px;box-shadow:inset 0 2px 3px rgba(90,30,0,.4)}
.st.hd2{outline:2px solid var(--ink);outline-offset:-1px}
.list{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow-y:auto}
.item{display:flex;align-items:center;gap:8px;background:#d9cca6;border:1px solid #a8996f;border-radius:6px;padding:8px}
.item.cur{border-color:#a04a12;box-shadow:inset 3px 0 0 var(--orange)}
.item .open{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.item small{font-size:12px;color:#5a4a2a}
.item .msk{max-width:100%;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.del{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#7a1f15}
.empty{text-align:center;padding:30px 10px;color:#5a4a2a;font-size:14px}
.pop{position:absolute;left:9px;right:9px;top:96px;z-index:9;background:#f5efd6;border:1px solid #a8996f;border-radius:6px;padding:8px;display:none;flex-direction:column;gap:8px;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.pop.on{display:flex}
.pop button{text-align:left;padding:2px 0}
.pop .msk{font-size:13px;padding:5px 12px}
#modal{position:absolute;inset:0;z-index:9;background:rgba(30,18,8,.55);display:none;align-items:center;justify-content:center;padding:18px}
#modal.on{display:flex}
.card{background:#f5efd6;border-radius:4px;padding:16px 14px;width:100%;box-shadow:0 4px 14px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:1.4;color:var(--ink)}
.card input[type=range]{width:100%}
.card .big{font-size:20px;text-align:center}
#toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%) rotate(-1deg);z-index:10;display:none;max-width:90%;white-space:normal;text-align:center}
#toast.on{display:inline-flex}
@media (prefers-reduced-motion:reduce){.sp,.rec.blink .recdot,.arm.rc{animation:none}}
</style>
</head>
<body>
<div id="app"><div id="wood"><div id="panel">

<section id="scrMain" class="scr on">
  <div class="row top">
    <button class="gaf sk" id="bIdeas" style="transform:rotate(-1.5deg)"></button>
    <input id="title" class="msk sk" maxlength="40" aria-label="Idea title" enterkeyhint="done">
    <button class="gear" id="bSet" aria-label="Settings"></button>
  </div>
  <div class="win">
    <div class="reel" id="r1"></div>
    <div class="mid">
      <div class="lcd">
        <div class="lr"><button class="adj" data-a="bpm-">&minus;</button><span class="v" id="bpm">090</span><button class="adj" data-a="bpm+">+</button><span class="u">bpm</span><button class="tapk" id="tap">tap</button></div>
        <div class="lr"><button class="adj" data-a="bars-">&minus;</button><span class="v" id="bars">2</span><button class="adj" data-a="bars+">+</button><span class="u">bars</span><span class="r" id="ctr">00:00</span></div>
      </div>
      <svg viewBox="0 0 190 62" width="100%" style="display:block;margin-top:5px"><rect x="1" y="1" width="188" height="60" rx="4" fill="#f1e3b1" stroke="#3b2616" stroke-width="2"/><path d="M64.4 32.3 A40 40 0 0 1 111.9 21.7" fill="none" stroke="#3b2616" stroke-width="1.5"/><path d="M111.9 21.7 A40 40 0 0 1 125.6 32.3" fill="none" stroke="#c0392b" stroke-width="4"/><g stroke="#3b2616" stroke-width="1.2"><line x1="66" y1="35" x2="63" y2="31"/><line x1="76" y1="26" x2="74" y2="22"/><line x1="90" y1="20" x2="89" y2="16"/><line x1="100" y1="20" x2="101" y2="16"/><line x1="114" y1="23" x2="117" y2="20"/><line x1="124" y1="31" x2="128" y2="29"/></g><g font-size="11" fill="#3b2616" text-anchor="middle"><text x="55" y="30">-20</text><text x="104" y="13">0</text><text x="134" y="28">+3</text></g><text x="8" y="56" font-size="11" fill="#3b2616">VU</text><line id="nd" x1="95" y1="58" x2="95" y2="22" stroke="#2a190b" stroke-width="1.6" style="transform-origin:95px 58px;transform:rotate(-40deg)"/><circle cx="95" cy="58" r="5" fill="#2a190b"/><polygon points="1,1 120,1 70,61 1,61" fill="#fff" opacity=".13"/></svg>
    </div>
    <div class="reel" id="r2"></div>
  </div>
  <div class="row">
    <button class="key" id="kClick"><span class="led"></span><span class="sk" style="font-size:11px">Click</span></button>
    <button class="key rec" id="kRec" aria-label="Record"><span class="recdot"></span></button>
    <button class="key" id="kPlay" aria-label="Play/pause"></button>
    <button class="key" id="kStop" aria-label="Stop"></button>
  </div>
  <div class="tw">
    <div class="twm" id="twm"><div class="tl" id="tl"></div><div class="tc" id="tc"><i id="ph"></i></div></div>
    <div class="nudge" id="nudge" style="display:none"><span class="msk sk" id="nl">Take 1</span><button class="arr nb" id="nL" aria-label="Nudge earlier"></button><span class="nv" id="nv">0 ms</span><button class="arr nb" id="nR" aria-label="Nudge later"></button><button class="gaf sk" id="nZ" aria-label="Reset nudge"></button></div>
  </div>
  <div id="chs"></div>
  <div class="row bot">
    <button class="gaf sk" id="bNew" style="transform:rotate(1.2deg)"></button>
    <button class="gaf sk" id="bExport" style="transform:rotate(-1.4deg)"></button>
  </div>
</section>

<section id="scrDrum" class="scr">
  <div class="row top">
    <button class="gaf sk" id="bBack" style="transform:rotate(-1.5deg)"></button>
    <span class="msk sk" style="margin-left:auto;font-size:13px;padding:4px 12px;transform:rotate(1.8deg)">Drum pattern</span>
  </div>
  <div class="preset"><button class="arr" id="pPrev" aria-label="Previous pattern"></button><button class="msk sk" id="pname"></button><button class="arr" id="pNext" aria-label="Next pattern"></button></div>
  <canvas id="mini" width="320" height="80"></canvas>
  <div class="gw">
    <div class="labs" id="labs"></div>
    <div id="sc"><div class="in" id="in"></div></div>
  </div>
  <div class="row">
    <button class="key" id="dPlay" aria-label="Play/pause"></button>
    <button class="key" id="dStop" aria-label="Stop"></button>
    <button class="key" id="dClr"></button>
  </div>
  <div style="display:flex;justify-content:center"><div class="pnote sk" style="transform:rotate(-1.8deg)"><i style="left:8px;transform:rotate(-6deg)"></i><i style="right:8px;transform:rotate(5deg)"></i>tap a name to hear it</div></div>
  <div class="pop" id="pop"></div>
</section>

<section id="scrIdeas" class="scr">
  <div class="row top">
    <button class="gaf sk" id="iBack" style="transform:rotate(-1.5deg)"></button>
    <span class="msk sk" style="margin-left:auto;font-size:13px;padding:4px 12px;transform:rotate(1.8deg)">Ideas</span>
    <button class="gaf sk" id="iNew" style="transform:rotate(1.2deg)"></button>
  </div>
  <div class="list" id="list"></div>
</section>

<div id="tex"></div>
<div id="toast" class="gaf sk"></div>
<div id="modal"><div class="card">
  <div class="msk sk" style="align-self:flex-start;transform:rotate(-1.5deg);font-size:13px">Latency offset</div>
  <div class="big sk" id="latv">120 ms</div>
  <input type="range" id="lat" min="-50" max="400" step="5">
  <div style="font-size:13px">Takes are shifted earlier by this much so they land on the beat. If your takes sound late, raise it. Wired headphones need less than Bluetooth.</div>
  <button class="gaf sk" id="mClose" style="align-self:flex-end">Done</button>
</div></div>

</div></div></div>

<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ic=(p,f)=>`<svg viewBox="0 0 24 24" width="18" height="18" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const IC={play:ic('<path d="M7 4v16l13-8z"/>',1),stop:ic('<rect x="6" y="6" width="12" height="12" rx="1.5"/>',1),back:ic('<path d="M15 5l-7 7 7 7"/>'),next:ic('<path d="M9 5l7 7-7 7"/>'),menu:ic('<path d="M4 7h16M4 12h16M4 17h16"/>'),plus:ic('<path d="M12 5v14M5 12h14"/>'),trash:ic('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'),dl:ic('<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>'),x:ic('<path d="M6 6l12 12M18 6L6 18"/>'),gear:ic('<circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.5" stroke-dasharray="3.2 2.3" stroke-width="3.6"/>'),erase:ic('<path d="M5 15l8-9 7 7-5 6H9zM9 20h11"/>')};

/* ---------- presets ---------- */
/*P*/
const E='-';
const PRESETS=[
{n:'Four on the floor',bpm:124,p:['x...x...x...x...|x...x...x...x...',E,E,'....x.......x...|....x.......x...','x...x...x...x...|x...x...x...x...','..x...x...x...x.|..x...x...x...x.',E,'x...............|................']},
{n:'Boom bap',bpm:90,p:['x.....x...x.....|x.....x..x..x...',E,'....x.......x...|....x.......x...',E,'x.x.x.x.x.x.x.x.|x.x.x.x.x.x.x.x.','..............x.|..............x.',E,E]},
{n:'Trap',bpm:140,p:['x.........x.....|x.....x....x....','.......x........|...........x....','........x.......|........x.......','........x.......|........x.......','x.x.x.x.xxx.x.x.|x.x.x.x.x.xxxxxx','.............x..|..............x.',E,'x...............|................']},
{n:'Rock',bpm:110,p:['x.......x.x.....|x.......x.....x.',E,'....x.......x...|....x.......x...',E,'x.x.x.x.x.x.x.x.|x.x.x.x.x.x.x.x.',E,'................|............x.x.','x...............|................']},
